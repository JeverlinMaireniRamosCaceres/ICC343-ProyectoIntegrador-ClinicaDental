services:
  app:
    build: .
    container_name: clinica_app
    restart: unless-stopped
    ports:
      - "80:10000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.4
    container_name: clinica_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clinica_dental
      MYSQL_USER: clinica
      MYSQL_PASSWORD: clinica123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clinica_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"

