services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: clinica_app
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - public_data:/var/www/html/public
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - clinica

    nginx:
        image: nginx:alpine
        container_name: clinica_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        depends_on:
            - app
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - public_data:/var/www/html/public:ro
        networks:
            - clinica

    mysql:
        image: mysql:8.4
        container_name: clinica_mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - clinica

volumes:
    mysql_data:
    public_data:

networks:
    clinica:
        driver: bridge
