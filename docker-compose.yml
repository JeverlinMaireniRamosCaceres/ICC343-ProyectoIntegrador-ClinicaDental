services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: clinica_app

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - mysql

    networks:
      - clinica

  nginx:
    image: nginx:latest

    container_name: clinica_nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
     - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
     - /etc/letsencrypt:/etc/letsencrypt:ro
     - ./:/var/www

    depends_on:
      - app

    networks:
      - clinica

  mysql:
    image: mysql:8.0

    container_name: clinica_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: clinica_dental
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - clinica

volumes:
  mysql_data:

networks:
  clinica:
