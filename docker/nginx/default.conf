server {

    listen 80;
    server_name clinicadental.emilpaulino.dev;

    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;

    server_name clinicadental.emilpaulino.dev;

    ssl_certificate /etc/letsencrypt/live/clinicadental.emilpaulino.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinicadental.emilpaulino.dev/privkey.pem;

    index index.php index.html;

    root /var/www/public;

    location / {

        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {

        deny all;
    }
}
